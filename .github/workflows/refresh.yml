name: refresh
# Weekly: download the latest data, re-run the forecast, and commit the new files.
# Needs repository secrets EIA_API_KEY and FRED_API_KEY
# (Settings > Secrets and variables > Actions).
on:
  schedule:
    - cron: "0 14 * * 2"   # Tuesdays 14:00 UTC, after EIA's Monday diesel update
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch data
        run: python scripts/fetch_data.py
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Forecast
        run: python scripts/run_forecast.py
      - name: Commit new data and forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data outputs
          git diff --cached --quiet || git commit -m "chore(data): weekly refresh $(date -u +%F)"
          git push
